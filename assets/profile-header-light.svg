<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cleiton Menezes — Software Engineer</title>
  <desc id="desc">Software Evolution. A path moves from uncertainty through investigation toward safer change.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c5cbc6" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="360" fill="#f4f1e9"/>
  <rect x="710" width="490" height="360" fill="url(#grid)"/>
  <line x1="710" y1="0" x2="710" y2="360" stroke="#c5cbc6"/>
  <text x="58" y="70" fill="#8f351e" font-family="Cascadia Mono, ui-monospace, monospace" font-size="15" letter-spacing="2">SOFTWARE ENGINEER · SOFTWARE EVOLUTION</text>
  <text x="58" y="145" fill="#142027" font-family="Segoe UI, Inter, sans-serif" font-size="56" font-weight="600" letter-spacing="-2">Cleiton Menezes</text>
  <text x="58" y="202" fill="#142027" font-family="Segoe UI, Inter, sans-serif" font-size="30">Make the next change safer.</text>
  <text x="58" y="251" fill="#647077" font-family="Segoe UI, Inter, sans-serif" font-size="20">Turning uncertainty into understanding —</text>
  <text x="58" y="281" fill="#647077" font-family="Segoe UI, Inter, sans-serif" font-size="20">and understanding into action.</text>
  <text x="58" y="327" fill="#647077" font-family="Cascadia Mono, ui-monospace, monospace" font-size="12" letter-spacing="1">QUESTION → INVESTIGATE → MODEL → DECIDE → ACT</text>
  <g transform="translate(742 22)">
    <circle cx="110" cy="176" r="70" fill="none" stroke="#647077" stroke-dasharray="5 7" opacity=".7"/>
    <circle cx="110" cy="176" r="40" fill="none" stroke="#647077" stroke-dasharray="5 7" opacity=".7"/>
    <circle cx="110" cy="176" r="15" fill="#f4f1e9" stroke="#142027" stroke-width="3"/>
    <path d="M127 176C190 176 182 118 250 118S303 235 364 235 395 177 435 177" fill="none" stroke="#b64929" stroke-width="4"/>
    <circle cx="250" cy="118" r="7" fill="#f4f1e9" stroke="#142027" stroke-width="2"/>
    <circle cx="364" cy="235" r="7" fill="#f4f1e9" stroke="#142027" stroke-width="2"/>
    <rect x="424" y="166" width="22" height="22" fill="#b64929"/>
    <text x="67" y="285" fill="#647077" font-family="Cascadia Mono, ui-monospace, monospace" font-size="13">uncertainty</text>
    <text x="345" y="150" fill="#142027" font-family="Cascadia Mono, ui-monospace, monospace" font-size="13">safer change</text>
  </g>
</svg>
